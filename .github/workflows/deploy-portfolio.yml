# GitHub Pages deployment for the static portfolio at https://ankit-parekh.org/.
# Uses the same official Pages artifact/deploy actions as ReboundOps.
# GitHub Pages must be set to "GitHub Actions" and repository Actions must be enabled.
name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate portfolio SEO and crawlability
        run: node scripts/check-seo.mjs

  build:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v7.0.1

      - name: Build approved resume downloads
        run: |
          python -m pip install --disable-pip-version-check python-docx reportlab pypdf
          python scripts/build-fde-resumes.py
          python - <<'PY'
          from pypdf import PdfReader
          from docx import Document
          from pathlib import Path
          pdf = Path('AnkitParekh_Resume.pdf')
          docx = Path('AnkitParekh_Resume.docx')
          assert len(PdfReader(str(pdf)).pages) == 2, "Resume PDF should be 2 pages"
          text = ' '.join(p.text for p in Document(str(docx)).paragraphs)
          assert 'Principal Forward-Deployed Engineer' in text
          assert 'AI multi-agent assistant' in text
          assert '11 customer organizations' in text
          for stale in ('SOP', 'Zooty', 'Earlier Professional Experience'):
              assert stale not in text, f'Stale resume text: {stale}'
          assert pdf.stat().st_size > 1000 and docx.stat().st_size > 1000
          PY

      - name: Stage static portfolio files
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html open-source-projects.html privacy.html robots.txt sitemap.xml CNAME AnkitParekh_Resume.pdf AnkitParekh_Resume.docx _site/
          cp -R assets css favicons img js _site/
          cp .nojekyll _site/.nojekyll
          test -s _site/index.html
          test -s _site/robots.txt
          test -s _site/sitemap.xml
          test -s _site/CNAME
          test -s _site/open-source-projects.html
          test -s _site/privacy.html
          test -s _site/AnkitParekh_Resume.pdf
          test -s _site/AnkitParekh_Resume.docx
          echo "Verified portfolio files:"
          find _site -maxdepth 2 -type f | sort

      - name: Upload portfolio for GitHub Pages
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
